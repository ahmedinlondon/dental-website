<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css?v=37">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">
  <div class="logo">Smile Studio Clinic</div>
  <nav>
    <a href="index.html?v=3">Home</a>
    <a href="about.html?v=3">About</a>
    <a href="services.html?v=3">Services</a>
    <a href="pricing.html?v=1">Pricing</a>
    <a href="faq.html?v=1">FAQ</a>
    <a href="contact.html?v=3">Contact</a>
  </nav>
</header>

<section class="section">

<div class="faq-container">

<h2 class="faq-title">Frequently Asked Questions</h2>

<div class="info-box faq-intro">
Orthodontic treatment is a carefully planned journey designed to create healthy, confident smiles at any age.
</div>

<!-- CATEGORY BOXES -->
<div class="faq-grid">
  <div class="faq-box" onclick="openSection('pre')">Pre-Treatment</div>
  <div class="faq-box" onclick="openSection('during')">During Treatment</div>
  <div class="faq-box" onclick="openSection('options')">Braces & Aligners</div>
  <div class="faq-box" onclick="openSection('post')">Post-Treatment</div>
</div>

<!-- RIGHT PANEL -->
<div id="faqPanel" class="faq-panel"></div>

</div>
</section>

<footer>
  <p>© 2026 Smile Studio Clinic</p>
  <div>
    <a href="#" class="icon instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="icon facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="icon whatsapp"><i class="fab fa-whatsapp"></i></a>
    <a href="#" class="icon youtube"><i class="fab fa-youtube"></i></a>
  </div>
</footer>

<script>

const faqData = {

  pre: `
    <div class="faq-item"><button class="faq-question">What is the difference between a dentist and an orthodontist? <span>▼</span></button><div class="faq-answer">An orthodontist has 3 extra years of specialist training.</div></div>
    <div class="faq-item"><button class="faq-question">Best age for check-up? <span>▼</span></button><div class="faq-answer">Around age 7.</div></div>
    <div class="faq-item"><button class="faq-question">Am I too old? <span>▼</span></button><div class="faq-answer">No, treatment works at any age.</div></div>
    <div class="faq-item"><button class="faq-question">Initial assessment? <span>▼</span></button><div class="faq-answer">We scan, assess and plan treatment.</div></div>
    <div class="faq-item"><button class="faq-question">Why X-ray? <span>▼</span></button><div class="faq-answer">To see hidden teeth and roots.</div></div>
    <div class="faq-item"><button class="faq-question">Fix cavities first? <span>▼</span></button><div class="faq-answer">Yes, teeth must be healthy.</div></div>
    <div class="faq-item"><button class="faq-question">Missing teeth? <span>▼</span></button><div class="faq-answer">We can close or prepare space.</div></div>
  `,

  during: `
    <div class="faq-item"><button class="faq-question">Does it hurt? <span>▼</span></button><div class="faq-answer">Mild discomfort only.</div></div>
    <div class="faq-item"><button class="faq-question">How long? <span>▼</span></button><div class="faq-answer">12–30 months.</div></div>
    <div class="faq-item"><button class="faq-question">Visits? <span>▼</span></button><div class="faq-answer">Every 6–8 weeks.</div></div>
    <div class="faq-item"><button class="faq-question">See dentist? <span>▼</span></button><div class="faq-answer">Yes, regularly.</div></div>
    <div class="faq-item"><button class="faq-question">Food restrictions? <span>▼</span></button><div class="faq-answer">Avoid hard/sticky foods.</div></div>
    <div class="faq-item"><button class="faq-question">Sports? <span>▼</span></button><div class="faq-answer">Use a mouthguard.</div></div>
  `,

  options: `
    <div class="faq-item"><button class="faq-question">Aligners effective? <span>▼</span></button><div class="faq-answer">Yes for mild cases.</div></div>
    <div class="faq-item"><button class="faq-question">Faster? <span>▼</span></button><div class="faq-answer">Depends on case.</div></div>
    <div class="faq-item"><button class="faq-question">Comfort? <span>▼</span></button><div class="faq-answer">Aligners more comfortable.</div></div>
    <div class="faq-item"><button class="faq-question">Eat normally? <span>▼</span></button><div class="faq-answer">Yes with aligners.</div></div>
    <div class="faq-item"><button class="faq-question">Cleaning? <span>▼</span></button><div class="faq-answer">Aligners easier.</div></div>
    <div class="faq-item"><button class="faq-question">Price? <span>▼</span></button><div class="faq-answer">Braces cheaper.</div></div>
    <div class="faq-item"><button class="faq-question">Ceramic vs metal? <span>▼</span></button><div class="faq-answer">Ceramic discreet, metal strong.</div></div>
  `,

  post: `
    <div class="faq-item"><button class="faq-question">Why retainer? <span>▼</span></button><div class="faq-answer">To keep teeth stable.</div></div>
    <div class="faq-item"><button class="faq-question">After treatment? <span>▼</span></button><div class="faq-answer">We provide 2 follow-ups.</div></div>
  `
};

function openSection(section) {

  const panel = document.getElementById("faqPanel");

  if (panel.dataset.open === section) {
    panel.style.display = "none";
    panel.dataset.open = "";
    return;
  }

  panel.innerHTML = faqData[section];
  panel.style.display = "block";
  panel.dataset.open = section;

  const questions = panel.querySelectorAll(".faq-question");

  questions.forEach(q => {
    q.addEventListener("click", () => {

      questions.forEach(item => {
        if (item !== q) {
          item.nextElementSibling.style.display = "none";
        }
      });

      const answer = q.nextElementSibling;
      answer.style.display =
        answer.style.display === "block" ? "none" : "block";
    });
  });
}

document.addEventListener("click", function(e) {

  const panel = document.getElementById("faqPanel");
  const boxes = document.querySelector(".faq-grid");

  if (!panel.contains(e.target) && !boxes.contains(e.target)) {
    panel.style.display = "none";
    panel.dataset.open = "";
  }

});

</script>

</body>
</html>
