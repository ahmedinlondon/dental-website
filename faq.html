<section class="section">

<div class="faq-container">

<h2 class="faq-title">Frequently Asked Questions</h2>

<div class="info-box faq-intro">
Orthodontic treatment is a carefully planned journey designed to create healthy, confident smiles at any age.
</div>

<!-- CATEGORY BOXES -->
<div class="faq-grid">
  <div class="faq-box" onclick="openSection('pre')">Pre-Treatment</div>
  <div class="faq-box" onclick="openSection('during')">During Treatment</div>
  <div class="faq-box" onclick="openSection('options')">Braces & Aligners</div>
  <div class="faq-box" onclick="openSection('post')">Post-Treatment</div>
</div>

<!-- RIGHT PANEL -->
<div id="faqPanel" class="faq-panel"></div>

</div>
</section>

<footer>
  <p>© 2026 Smile Studio Clinic</p>
  <div>
    <a href="#" class="icon instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="icon facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="icon whatsapp"><i class="fab fa-whatsapp"></i></a>
    <a href="#" class="icon youtube"><i class="fab fa-youtube"></i></a>
  </div>
</footer>

<script>

const faqData = {

  pre: `

    <div class="faq-item"><button class="faq-question">What is the difference between a dentist and an orthodontist? <span>▼</span></button><div class="faq-answer">An orthodontist is a registered dentist who has completed additional specialist training dedicated specifically to moving teeth and correcting jaw structures.</div></div>

    <div class="faq-item"><button class="faq-question">What is the best age for a first orthodontic check-up? <span>▼</span></button><div class="faq-answer">It is generally recommended that children have an initial orthodontic screening around age 7 to monitor jaw growth and the eruption of permanent teeth.</div></div>

    <div class="faq-item"><button class="faq-question">Am I too old for braces? <span>▼</span></button><div class="faq-answer">No. Orthodontic treatment can be successful at almost any age. Many adults now choose discreet options such as clear aligners or ceramic braces.</div></div>

    <div class="faq-item"><button class="faq-question">What happens during the initial orthodontic assessment? <span>▼</span></button><div class="faq-answer">The orthodontist examines your bite, takes digital scans or impressions, and captures clinical photographs to create an individual treatment plan.</div></div>

    <div class="faq-item"><button class="faq-question">Why do I need a Panoramic X-ray? <span>▼</span></button><div class="faq-answer">A panoramic X-ray shows the roots of your teeth, jawbone, and any impacted teeth that cannot be seen by eye. This helps ensure it is safe to begin moving the teeth.</div></div>

    <div class="faq-item"><button class="faq-question">Do I need to fix cavities or gum issues before treatment? <span>▼</span></button><div class="faq-answer">Yes. Teeth and gums must be healthy before treatment begins. Any fillings, root canals, or gum treatment should be completed first.</div></div>

    <div class="faq-item"><button class="faq-question">What if I have missing teeth? <span>▼</span></button><div class="faq-answer">Orthodontics can help by either closing the space or creating the ideal amount of room for a future implant, bridge, or restorative treatment.</div></div>

  `,

  during: `

    <div class="faq-item"><button class="faq-question">Does orthodontic treatment hurt? <span>▼</span></button><div class="faq-answer">Orthodontic treatment is not usually painful, but you may feel mild discomfort or soreness for a few days after braces are fitted or adjusted.</div></div>

    <div class="faq-item"><button class="faq-question">How long does treatment usually take? <span>▼</span></button><div class="faq-answer">Treatment time depends on the complexity of the case. Most orthodontic treatments take between 12 and 30 months.</div></div>

    <div class="faq-item"><button class="faq-question">How often are follow-up appointments? <span>▼</span></button><div class="faq-answer">Follow-up appointments are usually needed every 6 to 8 weeks to monitor progress and make adjustments.</div></div>

    <div class="faq-item"><button class="faq-question">Do I still need to see my regular dentist? <span>▼</span></button><div class="faq-answer">Yes. You should continue routine dental check-ups every 6 months to make sure your teeth and gums stay healthy during treatment.</div></div>

    <div class="faq-item"><button class="faq-question">Are there food restrictions with braces? <span>▼</span></button><div class="faq-answer">With fixed braces, you should avoid hard, sticky, or chewy foods such as toffee, hard nuts, popcorn, and chewing gum because they can damage brackets or wires.</div></div>

    <div class="faq-item"><button class="faq-question">Can I still play sports or musical instruments? <span>▼</span></button><div class="faq-answer">Yes. A protective mouthguard is recommended for contact sports. Wind instrument players may need a short adjustment period.</div></div>

  `,

  options: `

    <div class="faq-item"><button class="faq-question">Are clear aligners as effective as traditional braces? <span>▼</span></button><div class="faq-answer">Clear aligners are highly effective for mild to moderate alignment issues. Fixed braces remain the gold standard for complex bite problems, severe crowding, or significant tooth rotations.</div></div>

    <div class="faq-item"><button class="faq-question">Which option works faster? <span>▼</span></button><div class="faq-answer">It depends on the complexity of the case. Aligners may be faster for simple cases, while braces are often more efficient for complex movements.</div></div>

    <div class="faq-item"><button class="faq-question">How do lifestyle requirements differ? <span>▼</span></button><div class="faq-answer">Aligners require discipline because they must be worn for 20–22 hours per day. Braces are fixed, so they work continuously without needing to remember to put them back in.</div></div>

    <div class="faq-item"><button class="faq-question">Which is more comfortable? <span>▼</span></button><div class="faq-answer">Clear aligners are generally more comfortable because they are smooth and removable. Braces may cause temporary rubbing or soreness after adjustments.</div></div>

    <div class="faq-item"><button class="faq-question">Can I eat whatever I want? <span>▼</span></button><div class="faq-answer">With aligners, you remove them to eat, so there are no dietary restrictions. With braces, hard, sticky, and chewy foods should be avoided.</div></div>

    <div class="faq-item"><button class="faq-question">Which is easier to clean? <span>▼</span></button><div class="faq-answer">Aligners are easier to clean because they are removed for brushing and flossing. Braces require extra care and special cleaning tools.</div></div>

    <div class="faq-item"><button class="faq-question">What is the main difference between ceramic and metal braces? <span>▼</span></button><div class="faq-answer">Ceramic braces use clear or tooth-coloured brackets, making them less noticeable. Metal braces are more visible but very strong and reliable.</div></div>

    <div class="faq-item"><button class="faq-question">Are ceramic braces less durable? <span>▼</span></button><div class="faq-answer">Ceramic brackets are strong but slightly more brittle than metal. Metal braces are generally more durable for everyday wear.</div></div>

    <div class="faq-item"><button class="faq-question">Do ceramic braces stain? <span>▼</span></button><div class="faq-answer">The ceramic brackets themselves do not stain, but the elastic ties can discolour with coffee, curry, or red wine. These ties are replaced at adjustment visits.</div></div>

  `,

  post: `

    <div class="faq-item"><button class="faq-question">Why do I need to wear a retainer? <span>▼</span></button><div class="faq-answer">Teeth naturally tend to move back after treatment. Retainers are essential to keep them in their corrected position long-term.</div></div>

    <div class="faq-item"><button class="faq-question">What happens when my treatment is finalised? <span>▼</span></button><div class="faq-answer">We provide two follow-up check-up visits within 12 months after your treatment is completed, included in your care plan.</div></div>

  `

};

function openSection(section) {

  const panel = document.getElementById("faqPanel");

  if (panel.dataset.open === section) {

    panel.style.display = "none";

    panel.dataset.open = "";

    return;

  }

  panel.innerHTML = faqData[section];

  panel.style.display = "block";

  panel.dataset.open = section;

  const questions = panel.querySelectorAll(".faq-question");

  questions.forEach(q => {

    q.addEventListener("click", () => {

      const answer = q.nextElementSibling;

      answer.style.display = answer.style.display === "block" ? "none" : "block";

    });

  });

}

document.addEventListener("click", function(e) {

  const panel = document.getElementById("faqPanel");

  const boxes = document.querySelector(".faq-grid");

  if (!panel.contains(e.target) && !boxes.contains(e.target)) {

    panel.style.display = "none";

    panel.dataset.open = "";

  }

});

</script>

</body>
</html>
